name: quantbacktest

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantbacktest-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./backend/config.docker.ini
        target: /app/config.ini
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/docs', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantbacktest-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
